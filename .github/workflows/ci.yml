name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    # package-generator-cli ships as an arm64 macOS binary, so the plugin builds on Apple silicon only.
    # Package.swift needs tools 6.2 (Xcode 26), the default on macos-26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Architecture rules
        run: swift test --package-path Architecture
      - name: Build benchmarks
        # Built, not run: shared runners are too noisy to compare timings. jemalloc is off so the runner needs no
        # Homebrew package; run them locally as docs/performance.md describes.
        env:
          BENCHMARK_DISABLE_JEMALLOC: "true"
        run: swift build --package-path Benchmarks
